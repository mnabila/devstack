name: infra

services:
  portainer:
    image: docker.io/portainer/portainer-ce
    ports:
      - "9443:9443"
      - "8000:8000"
    volumes:
      - /run/user/1000/podman/podman.sock:/var/run/docker.sock:Z
      - ./data/portainer:/data
    security_opt:
      - label=disable
    restart: unless-stopped

  postgresql:
    image: postgres:17
    networks:
      - bridge
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  mariadb:
    image: mariadb:lts
    environment:
      MARIADB_ROOT_PASSWORD: toor
      TZ: Asia/Jakarta
    ports:
      - "3306:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql

  rabbitmq:
    build:
      context: ./services/rabbitmq
      dockerfile: Dockerfile
    networks:
      - bridge
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq:Z
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:8.2
    networks:
      - bridge
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    networks:
      - bridge
    environment:
      - DB_TYPE=sqlite

      # Authentication
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin

      # Webhook
      - WEBHOOK_URL=https://n8n.mnabila.my.id

      # Timezone
      - GENERIC_TIMEZONE=Asia/Jakarta
      - TZ=Asia/Jakarta
    volumes:
      - ./data/n8n:/home/node/.n8n:Z
    ports:
      - "5678:5678"

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      - RUSTFS_ROOT_USER=admin
      - RUSTFS_ROOT_PASSWORD=admin123
    volumes:
      - rustfs:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped

  omnirouter:
    image: diegosouzapw/omniroute:latest
    networks:
      - bridge
    environment:
      # Redis from infra stack
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/app/data
      # Native default ports
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - LIVE_WS_PORT=20132
      - NEXT_PUBLIC_BASE_URL=http://127.0.0.1:20128
    volumes:
      - ./data/omnirouter:/app/data:Z,U
    ports:
      - "20128:20128"
      - "20129:20129"
      - "20132:20132"
    depends_on:
      - redis
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  rustfs:

networks:
  bridge:
    driver: bridge
